schema_version: 1
title: Chordnote — 知识建筑师的工作台
direction: knowledge-architect-worktable
subject_count: 1
subject:
  identity: >-
    One continuous physical study worktable: a pale ash desktop around one large
    warm-ivory graph-paper sheet, twelve small paper notes, violet link-lines,
    and a restrained modular paper knowledge structure. No people, devices, logos, or generated text.
  anchors:
    - top-down, slightly oblique editorial view of a physical pale-ash desk
    - one large warm ivory graph-paper sheet with a fine graphite grid
    - twelve unlabelled note cards with charcoal marks and violet link-lines
    - charcoal ink, soft indigo paper shadows, and one Chordnote violet accent
    - same desk, paper, card count, light direction, scale, and viewpoint in every shot
style: >-
  A quiet Swiss Internationalist editorial illustration with tactile paper edges,
  sharp charcoal line work, a restrained violet accent, broad paper margins, and
  visible surface detail. It is an original knowledge-product story, with no copied artwork, layout,
  text, characters, or assets from the reference site.
scene: >-
  A large physical knowledge worktable. Isolated learning notes begin scattered
  on the central sheet, align into groups, acquire visible violet links, and
  finish as a low modular paper structure that reads as a connected knowledge system.
story: >-
  From scattered learning fragments to a stable interdisciplinary knowledge
  network; the motion makes AI's organizing role visible without depicting autonomous writing.
motion_intent: >-
  Scrolling reveals one physical transformation: notes gather, align, connect,
  and rise into an ordered paper framework. Every stopped frame remains legible.
driver: scroll
input_semantics: scroll-progress
time_control: scrub
navigation: continuous
parameter_space: linear
media_access: sequential
clip_continuity: chain
background_owner: video
aspect_ratio: 16:9
destination:
  component: components/landing-page.tsx
  placement: full-width landing hero motion stage on desktop
  maximum_css_size: 1280x720
  target_dpr: 1
  crop_policy: contain within a wide editorial frame; never crop the central paper worktable
  reduced_motion_state: K4
copy_reference:
  title: Chordnote
  subtitle: ——让 AI 成为你的知识架构师
  lede: 一条笔记是音符，连起来才是和弦。
constraints:
  - Use generated media only as the visual story; keep all readable product copy as HTML.
  - Preserve quiet, large-format drawing margins with sufficient contrast for adjacent Chinese copy.
  - Do not depict direct autonomous writing into a knowledge base; the visual narrative is organization and suggestion.
  - No screenshots, UI mockups, watermarks, literal text, brand marks, or imitation of the reference website.
