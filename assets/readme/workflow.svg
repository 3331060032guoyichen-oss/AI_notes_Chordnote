<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Chordnote 的 Raw、Draft、Review、Chord 四步知识整理闭环" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#97a3c4"/></marker>
<style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;text-anchor:middle}.t{font-size:22px;font-weight:700;fill:#efe6d0}.s{font-size:15px;fill:#97a3c4}.w{font-size:14px;fill:#97a3c4}.n{font-size:16px;font-weight:700}</style></defs>
<rect width="1200" height="340" rx="20" fill="#0a1020"/>
<g class="w"><text x="150" y="46">你来写</text><text x="450" y="46">AI 提议</text><text x="750" y="46">你来拍板</text><text x="1050" y="46">连成网络</text></g>
<g stroke="#97a3c4" stroke-width="2" marker-end="url(#a)"><path d="M198 120H398"/><path d="M498 120H686"/><path d="M798 120H998"/></g>
<g transform="translate(592 84)"><rect x="-4" y="0" width="8" height="72" rx="3" fill="#ff4a3d"/><text y="92" class="w" fill="#ff4a3d" style="fill:#ff4a3d">闸门</text></g>
<g fill="#0a1020" stroke-width="3">
<circle cx="150" cy="120" r="46" stroke="#97a3c4"/><circle cx="450" cy="120" r="46" stroke="#4f8cff" stroke-dasharray="7 6"/><circle cx="750" cy="120" r="46" stroke="#ff4a3d"/><circle cx="1050" cy="120" r="46" stroke="#f2b84b"/></g>
<g class="n"><text x="150" y="126" fill="#97a3c4">Raw</text><text x="450" y="126" fill="#4f8cff">Draft</text><text x="750" y="126" fill="#ff4a3d">Review</text><text x="1050" y="126" fill="#f2b84b">Chord</text></g>
<g class="t"><text x="150" y="214">原始记录</text><text x="450" y="214">知音提议</text><text x="750" y="214">用户确认</text><text x="1050" y="214">知识网络</text></g>
<g class="s"><text x="150" y="246">写入 raw/inbox/</text><text x="150" y="270">原文永不覆盖</text>
<text x="450" y="246">每个写入意图成为提议</text><text x="450" y="270">待确认,不入库</text>
<text x="750" y="246">确认入库,忽略即丢</text><text x="750" y="270">Diff 卡改写正文</text>
<text x="1050" y="246">进入 wiki,建立 Relation</text><text x="1050" y="270">图谱可拖动、缩放</text></g>
<text x="600" y="316" class="w">没有你的确认,任何内容都不会进入知识网络</text>
</svg>
