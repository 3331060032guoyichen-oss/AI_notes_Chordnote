<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Chordnote 将常见笔记工具的痛点转化为四项产品设计决定" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}.k{font-size:15px;fill:#97a3c4}.h{font-size:24px;font-weight:800}.d{font-size:16px;fill:#efe6d0}.c{fill:#121c38;stroke:#2a3860;stroke-width:1.5}</style></defs>
<rect width="1200" height="400" rx="20" fill="#0a1020"/>
<text x="600" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#efe6d0">常见笔记工具的痛点,变成四项设计决定</text>
<g transform="translate(30 80)">
<rect class="c" width="270" height="290" rx="14"/><rect width="270" height="6" rx="3" fill="#4f8cff"/>
<text class="k" x="22" y="48">痛点</text><text class="d" x="22" y="78" fill="#97a3c4" style="fill:#97a3c4">笔记散落,彼此孤立</text>
<path d="M135 100v34" stroke="#4f8cff" stroke-width="2"/><path d="M127 126l8 10 8-10" fill="none" stroke="#4f8cff" stroke-width="2"/>
<text class="h" x="22" y="180" fill="#4f8cff">AI 拓扑生长</text>
<text class="d" x="22" y="214">Agent 提议概念与关联,</text><text class="d" x="22" y="240">学生确认后再建立连接</text></g>
<g transform="translate(324 80)">
<rect class="c" width="270" height="290" rx="14"/><rect width="270" height="6" rx="3" fill="#ff4a3d"/>
<text class="k" x="22" y="48">痛点</text><text class="d" x="22" y="78" style="fill:#97a3c4">AI 黑盒改写原文</text>
<path d="M135 100v34" stroke="#ff4a3d" stroke-width="2"/><path d="M127 126l8 10 8-10" fill="none" stroke="#ff4a3d" stroke-width="2"/>
<text class="h" x="22" y="180" fill="#ff4a3d">零黑盒法则</text>
<text class="d" x="22" y="214">Raw 永远保留,</text><text class="d" x="22" y="240">AI 只能生成 Draft</text></g>
<g transform="translate(618 80)">
<rect class="c" width="270" height="290" rx="14"/><rect width="270" height="6" rx="3" fill="#f2b84b"/>
<text class="k" x="22" y="48">痛点</text><text class="d" x="22" y="78" style="fill:#97a3c4">反复复制粘贴上下文</text>
<path d="M135 100v34" stroke="#f2b84b" stroke-width="2"/><path d="M127 126l8 10 8-10" fill="none" stroke="#f2b84b" stroke-width="2"/>
<text class="h" x="22" y="180" fill="#f2b84b">@ 上下文复读</text>
<text class="d" x="22" y="214">问答面板直接引用笔记,</text><text class="d" x="22" y="240">服务端重读真实内容</text></g>
<g transform="translate(912 80)">
<rect class="c" width="258" height="290" rx="14"/><rect width="258" height="6" rx="3" fill="#efe6d0"/>
<text class="k" x="22" y="48">痛点</text><text class="d" x="22" y="78" style="fill:#97a3c4">Agent 行为难以审阅</text>
<path d="M129 100v34" stroke="#efe6d0" stroke-width="2"/><path d="M121 126l8 10 8-10" fill="none" stroke="#efe6d0" stroke-width="2"/>
<text class="h" x="22" y="180" fill="#efe6d0">LLM Wiki 规范</text>
<text class="d" x="22" y="214">把执行步骤写成可审阅</text><text class="d" x="22" y="240">的知识流程,有边界可追溯</text></g>
</svg>
